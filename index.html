<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Despesas</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .header-titles h1 {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .sync-status {
      font-size: 0.85rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 4px;
    }

    .sync-badge {
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .header-buttons {
      display: flex;
      gap: 10px;
    }

    .btn {
      background-color: #1e293b;
      color: #ffffff;
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn:hover {
      background-color: #334155;
    }

    .btn-primary {
      background-color: #2563eb;
      border-color: #2563eb;
    }

    .btn-primary:hover {
      background-color: #1d4ed8;
    }

    .btn-success {
      background-color: #16a34a;
      border-color: #16a34a;
    }

    .btn-success:hover {
      background-color: #15803d;
    }

    .btn-danger {
      background-color: #dc2626;
      border-color: #dc2626;
    }

    .btn-danger:hover {
      background-color: #b91c1c;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .card {
      background-color: #ffffff;
      color: #0f172a;
      padding: 15px 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .card-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .filters-section {
      background-color: #1e293b;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .filter-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .form-control {
      background-color: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    .form-control:focus {
      border-color: #3b82f6;
    }

    .checkbox-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
      font-size: 0.85rem;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    .table-container {
      background-color: #ffffff;
      border-radius: 8px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      color: #334155;
      font-size: 0.9rem;
    }

    th {
      background-color: #f8fafc;
      color: #475569;
      padding: 12px 16px;
      font-weight: 600;
      border-bottom: 1px solid #e2e8f0;
      white-space: nowrap;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid #e2e8f0;
      white-space: nowrap;
    }

    tbody tr:hover {
      background-color: #f1f5f9;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-block;
    }

    .badge-paga { background-color: #dcfce7; color: #166534; }
    .badge-aberto { background-color: #fef3c7; color: #92400e; }
    .badge-vencida { background-color: #fee2e2; color: #991b1b; }
    .badge-hoje { background-color: #e0e7ff; color: #3730a3; }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background-color: #1e293b;
      color: #f8fafc;
      padding: 24px;
      border-radius: 8px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      font-size: 1.2rem;
    }

    .close-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      color: #cbd5e1;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    @media (max-width: 768px) {
      .filter-row {
        flex-direction: column;
        align-items: stretch;
      }
      .form-control {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-titles">
        <h1>Controle de Despesas</h1>
        <div class="sync-status">
          Sincronização: <span id="sync-badge" class="sync-badge" style="background-color: #334155; color: #fff;">Carregando...</span>
        </div>
      </div>
      <div class="header-buttons">
        <button class="btn" onclick="abrirModalControles()">⚙️ Controles</button>
        <button class="btn btn-primary" onclick="abrirModalEdicao()">+ Nova Despesa</button>
      </div>
    </header>

    <div class="cards-grid">
      <div class="card">
        <div class="card-title">A VENCER</div>
        <div class="card-value" id="card-a-vencer">R$ 0,00</div>
      </div>
      <div class="card">
        <div class="card-title">VENCIDAS</div>
        <div class="card-value" id="card-vencidas">R$ 0,00</div>
      </div>
      <div class="card">
        <div class="card-title">VENCE HOJE</div>
        <div class="card-value" id="card-vence-hoje">R$ 0,00</div>
      </div>
      <div class="card">
        <div class="card-title">TOTAL SELECIONADAS</div>
        <div class="card-value" id="card-selecionadas">R$ 0,00</div>
      </div>
    </div>

    <div class="filters-section">
      <div class="filter-row">
        <select id="filter-controle" class="form-control" onchange="aplicarFiltros()"></select>
        <input type="text" id="filter-busca" class="form-control" placeholder="Pesquisar fornecedor..." oninput="aplicarFiltros()" style="flex: 1;">
        <input type="month" id="filter-mes" class="form-control" onchange="aplicarFiltros()">
        <input type="date" id="filter-de" class="form-control" onchange="aplicarFiltros()">
        <input type="date" id="filter-ate" class="form-control" onchange="aplicarFiltros()">
        <button class="btn" onclick="limparFiltros()">✕ Limpar</button>
      </div>

      <div class="filter-row" style="justify-content: space-between;">
        <div class="checkbox-group">
          <label class="checkbox-item"><input type="checkbox" id="chk-hoje" onchange="aplicarFiltros()"> Vence Hoje</label>
          <label class="checkbox-item"><input type="checkbox" id="chk-vencidas" checked onchange="aplicarFiltros()"> Vencidas</label>
          <label class="checkbox-item"><input type="checkbox" id="chk-aberto" checked onchange="aplicarFiltros()"> Em Aberto</label>
          <label class="checkbox-item"><input type="checkbox" id="chk-pagas" onchange="aplicarFiltros()"> Pagas</label>
          <label class="checkbox-item"><input type="checkbox" id="chk-todas" onchange="alternarTodasChecks(this)"> Todas</label>
          <a href="#" onclick="desmarcarTodosFiltrosStatus(); return false;" style="color: #94a3b8; text-decoration: underline; margin-left: 10px;">Desmarcar Tudo</a>
        </div>
      </div>

      <div class="filter-row">
        <button class="btn btn-success" onclick="pagarSelecionadas()">✓ Pagar</button>
        <button class="btn btn-danger" onclick="gerarPDFSelecionadas()">📄 PDF Selecionadas</button>
        <button class="btn" onclick="exportarCSV()">CSV</button>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th><input type="checkbox" id="select-all-rows" onclick="selecionarTodasLinhas(this)"></th>
            <th>Fornecedor ↕</th>
            <th>Valor ↕</th>
            <th>Vencimento ↕</th>
            <th>Pagamento ↕</th>
            <th>Situação</th>
            <th>Anexo</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-corpo"></tbody>
      </table>
    </div>
  </div>

  <div class="modal" id="modal-edicao">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-titulo">Nova Despesa</h3>
        <button class="close-btn" onclick="fecharModalEdicao()">&times;</button>
      </div>
      <form id="form-despesa" onsubmit="salvarEdicao(event)">
        <div class="form-group">
          <label for="edit-controle">Controle</label>
          <select id="edit-controle" class="form-control" required></select>
        </div>
        <div class="form-group">
          <label for="edit-fornecedor">Fornecedor</label>
          <input type="text" id="edit-fornecedor" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="edit-valor">Valor (R$)</label>
          <input type="text" id="edit-valor" class="form-control" placeholder="0,00" required>
        </div>
        <div class="form-group">
          <label for="edit-vencimento">Vencimento</label>
          <input type="date" id="edit-vencimento" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="edit-situacao">Situação</label>
          <select id="edit-situacao" class="form-control">
            <option value="EM ABERTO">EM ABERTO</option>
            <option value="PAGA">PAGA</option>
          </select>
        </div>
        <div class="form-group">
          <label for="edit-pagamento">Data de Pagamento</label>
          <input type="date" id="edit-pagamento" class="form-control">
        </div>
        <div class="form-group">
          <label for="edit-anexo">Anexo (Imagem / Documento)</label>
          <input type="file" id="edit-anexo" class="form-control" accept="image/*,.pdf">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn" onclick="fecharModalEdicao()">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal" id="modal-controles">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Gerenciar Controles</h3>
        <button class="close-btn" onclick="fecharModalControles()">&times;</button>
      </div>
      <div class="form-group">
        <label>Controles Existentes</label>
        <ul id="lista-controles-modal" style="list-style: none; margin-bottom: 15px;"></ul>
      </div>
      <div class="form-group">
        <label for="novo-controle-nome">Novo Controle</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="novo-controle-nome" class="form-control" placeholder="Nome do controle" style="flex: 1;">
          <button type="button" class="btn btn-primary" onclick="adicionarNovoControle()">Adicionar</button>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" onclick="fecharModalControles()">Fechar</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx7XwZmTXYiLEAmy7_kS9Z2FsNag3J01P2p0qO1aL1q/exec";

    let todasDespesas = [];
    let todosControles = ["Romerio", "Fazenda Boa Esperança", "Fazenda Alvorada"];
    let idEmEdicao = null;
    let linhaEmEdicao = null;

    window.onload = function() {
      carregarTudoGitHub();
    };

    function atualizarStatusSync(texto, cor) {
      const badge = document.getElementById("sync-badge");
      badge.textContent = texto;
      badge.style.backgroundColor = cor;
    }

    async function carregarTudoGitHub() {
      atualizarStatusSync("🔄 Sincronizando...", "#d97706");
      try {
        const response = await fetch(`${API_URL}?action=getDados`);
        const data = await response.json();
        
        todasDespesas = data.despesas || [];
        if (data.controles && data.controles.length > 0) {
          todosControles = data.controles;
        }

        atualizarSelectControles();
        aplicarFiltros();
        atualizarStatusSync("✓ Sincronizado", "#16a34a");
      } catch (err) {
        console.error(err);
        atualizarStatusSync("✕ Erro ao carregar", "#e53e3e");
      }
    }

    function atualizarSelectControles() {
      const selectFiltro = document.getElementById("filter-controle");
      const selectModal = document.getElementById("edit-controle");

      selectFiltro.innerHTML = "";
      selectModal.innerHTML = "";

      todosControles.forEach(ctrl => {
        selectFiltro.innerHTML += `<option value="${ctrl}">${ctrl}</option>`;
        selectModal.innerHTML += `<option value="${ctrl}">${ctrl}</option>`;
      });
    }

    function extrairValorNumerico(val) {
      if (typeof val === "number") return val;
      if (!val) return 0;
      let limp = val.toString().replace("R$", "").trim();
      limp = limp.replace(/\./g, "").replace(",", ".");
      return parseFloat(limp) || 0;
    }

    function formatarMoeda(val) {
      return val.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    }

    function calcularStatusAutomatico(vencIso, statusAtual) {
      if (statusAtual === "PAGA") return "PAGA";
      const hojeIso = new Date().toISOString().split("T")[0];
      if (vencIso < hojeIso) return "VENCIDA";
      if (vencIso === hojeIso) return "VENCE HOJE";
      return "EM ABERTO";
    }

    function aplicarFiltros() {
      const ctrl = document.getElementById("filter-controle").value;
      const busca = document.getElementById("filter-busca").value.toLowerCase();
      const mes = document.getElementById("filter-mes").value;
      const de = document.getElementById("filter-de").value;
      const ate = document.getElementById("filter-ate").value;

      const chkHoje = document.getElementById("chk-hoje").checked;
      const chkVencidas = document.getElementById("chk-vencidas").checked;
      const chkAberto = document.getElementById("chk-aberto").checked;
      const chkPagas = document.getElementById("chk-pagas").checked;

      const hojeIso = new Date().toISOString().split("T")[0];

      let aVencer = 0, vencidas = 0, venceHoje = 0;

      todasDespesas.forEach(d => {
        const status = calcularStatusAutomatico(d.vencimento, d.status);
        if (d.controle === ctrl) {
          if (status === "EM ABERTO") aVencer += d.valor;
          if (status === "VENCIDA") vencidas += d.valor;
          if (status === "VENCE HOJE" || (d.vencimento === hojeIso && status !== "PAGA")) venceHoje += d.valor;
        }
      });

      document.getElementById("card-a-vencer").textContent = formatarMoeda(aVencer);
      document.getElementById("card-vencidas").textContent = formatarMoeda(vencidas);
      document.getElementById("card-vence-hoje").textContent = formatarMoeda(venceHoje);

      const filtradas = todasDespesas.filter(d => {
        if (ctrl && d.controle !== ctrl) return false;
        if (busca && !d.fornecedor.toLowerCase().includes(busca)) return false;
        if (mes && !d.vencimento.startsWith(mes)) return false;
        if (de && d.vencimento < de) return false;
        if (ate && d.vencimento > ate) return false;

        const st = calcularStatusAutomatico(d.vencimento, d.status);
        let bateuStatus = false;
        if (chkHoje && (st === "VENCE HOJE" || (d.vencimento === hojeIso && st !== "PAGA"))) bateuStatus = true;
        if (chkVencidas && st === "VENCIDA") bateuStatus = true;
        if (chkAberto && st === "EM ABERTO") bateuStatus = true;
        if (chkPagas && st === "PAGA") bateuStatus = true;

        return bateuStatus;
      });

      renderizarTabela(filtradas);
    }

    function renderizarTabela(lista) {
      const tbody = document.getElementById("tabela-corpo");
      tbody.innerHTML = "";

      lista.forEach(d => {
        const st = calcularStatusAutomatico(d.vencimento, d.status);
        let badgeClass = "badge-aberto";
        if (st === "PAGA") badgeClass = "badge-paga";
        else if (st === "VENCIDA") badgeClass = "badge-vencida";
        else if (st === "VENCE HOJE") badgeClass = "badge-hoje";

        const tr = document.createElement("tr");
        tr.dataset.id = d.id;
        tr.dataset.anexo = d.anexo || "";
        tr.dataset.valor = d.valor;

        tr.innerHTML = `
          <td><input type="checkbox" class="row-checkbox" onchange="calcularTotalSelecionadas()"></td>
          <td>${d.fornecedor}</td>
          <td>${formatarMoeda(d.valor)}</td>
          <td>${d.vencimento ? d.vencimento.split("-").reverse().join("/") : ""}</td>
          <td>${d.pagamento ? d.pagamento.split("-").reverse().join("/") : "-"}</td>
          <td><span class="badge ${badgeClass}">${st}</span></td>
          <td>${d.anexo ? `<a href="${d.anexo}" target="_blank" style="color:#2563eb;">Ver Anexo</a>` : "-"}</td>
          <td>
            <button class="btn" style="padding: 2px 6px; font-size:0.75rem;" onclick="editarLinha('${d.id}')">✏️</button>
            <button class="btn btn-danger" style="padding: 2px 6px; font-size:0.75rem;" onclick="excluirDespesa('${d.id}')">🗑️</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      calcularTotalSelecionadas();
    }

    function calcularTotalSelecionadas() {
      const checkboxes = document.querySelectorAll(".row-checkbox:checked");
      let total = 0;
      checkboxes.forEach(cb => {
        const tr = cb.closest("tr");
        total += parseFloat(tr.dataset.valor) || 0;
      });
      document.getElementById("card-selecionadas").textContent = formatarMoeda(total);
    }

    function selecionarTodasLinhas(master) {
      const checkboxes = document.querySelectorAll(".row-checkbox");
      checkboxes.forEach(cb => cb.checked = master.checked);
      calcularTotalSelecionadas();
    }

    function alternarTodasChecks(master) {
      document.getElementById("chk-hoje").checked = master.checked;
      document.getElementById("chk-vencidas").checked = master.checked;
      document.getElementById("chk-aberto").checked = master.checked;
      document.getElementById("chk-pagas").checked = master.checked;
      aplicarFiltros();
    }

    function desmarcarTodosFiltrosStatus() {
      document.getElementById("chk-hoje").checked = false;
      document.getElementById("chk-vencidas").checked = false;
      document.getElementById("chk-aberto").checked = false;
      document.getElementById("chk-pagas").checked = false;
      document.getElementById("chk-todas").checked = false;
      aplicarFiltros();
    }

    function limparFiltros() {
      document.getElementById("filter-busca").value = "";
      document.getElementById("filter-mes").value = "";
      document.getElementById("filter-de").value = "";
      document.getElementById("filter-ate").value = "";
      document.getElementById("chk-vencidas").checked = true;
      document.getElementById("chk-aberto").checked = true;
      document.getElementById("chk-hoje").checked = false;
      document.getElementById("chk-pagas").checked = false;
      document.getElementById("chk-todas").checked = false;
      aplicarFiltros();
    }

    function abrirModalEdicao() {
      idEmEdicao = null;
      linhaEmEdicao = null;
      document.getElementById("form-despesa").reset();
      document.getElementById("modal-titulo").textContent = "Nova Despesa";
      document.getElementById("modal-edicao").classList.add("active");
    }

    function fecharModalEdicao() {
      document.getElementById("modal-edicao").classList.remove("active");
    }

    function editarLinha(id) {
      const item = todasDespesas.find(d => d.id.toString() === id.toString());
      if (!item) return;

      idEmEdicao = item.id;
      linhaEmEdicao = document.querySelector(`tr[data-id="${id}"]`);

      document.getElementById("edit-controle").value = item.controle;
      document.getElementById("edit-fornecedor").value = item.fornecedor;
      document.getElementById("edit-valor").value = item.valor.toLocaleString("pt-BR", { minimumFractionDigits: 2 });
      document.getElementById("edit-vencimento").value = item.vencimento;
      document.getElementById("edit-situacao").value = item.status === "PAGA" ? "PAGA" : "EM ABERTO";
      document.getElementById("edit-pagamento").value = item.pagamento || "";

      document.getElementById("modal-titulo").textContent = "Editar Despesa";
      document.getElementById("modal-edicao").classList.add("active");
    }

    async function salvarEdicao(event) {
      event.preventDefault();

      const novoControle = document.getElementById("edit-controle").value;
      const novoFornecedor = document.getElementById("edit-fornecedor").value.trim();
      const novoValorStr = document.getElementById("edit-valor").value.trim();
      const novoVencimentoIso = document.getElementById("edit-vencimento").value;
      const novaSituacao = document.getElementById("edit-situacao").value;
      const novoPagamentoIso = document.getElementById("edit-pagamento").value;
      const inputAnexo = document.getElementById("edit-anexo");

      const valorNumerico = extrairValorNumerico(novoValorStr);
      if (isNaN(valorNumerico)) return alert("Por favor, digite um valor numérico válido.");

      const processarEGuardar = async function(anexoBase64) {
        let statusCalculado = novaSituacao;
        if (novoPagamentoIso && novoPagamentoIso !== "") {
          statusCalculado = "PAGA";
        } else {
          statusCalculado = calcularStatusAutomatico(novoVencimentoIso, novaSituacao);
        }

        const objetoDespesa = {
          id: idEmEdicao || Date.now().toString(),
          controle: novoControle,
          fornecedor: novoFornecedor,
          valor: valorNumerico,
          vencimento: novoVencimentoIso,
          pagamento: novoPagamentoIso || "",
          status: statusCalculado,
          anexo: anexoBase64
        };

        atualizarStatusSync("☁️ Salvando na planilha...", "#d97706");

        try {
          await fetch(API_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
              action: "salvarDespesa",
              data: objetoDespesa
            })
          });

          setTimeout(async function() {
            await carregarTudoGitHub();
            fecharModalEdicao();
          }, 1500);

        } catch (err) {
          console.error(err);
          atualizarStatusSync("✕ Erro ao salvar", "#e53e3e");
        }
      };

      if (inputAnexo.files && inputAnexo.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) { processarEGuardar(e.target.result); };
        reader.readAsDataURL(inputAnexo.files[0]);
      } else {
        const anexoExistente = linhaEmEdicao ? linhaEmEdicao.dataset.anexo : "";
        processarEGuardar(anexoExistente);
      }
    }

    async function excluirDespesa(id) {
      if (!confirm("Tem certeza que deseja excluir esta despesa?")) return;
      atualizarStatusSync("☁️ Excluindo...", "#d97706");
      try {
        await fetch(`${API_URL}?action=excluirDespesa&id=${id}`);
        await carregarTudoGitHub();
      } catch (err) {
        console.error(err);
        atualizarStatusSync("✕ Erro ao excluir", "#e53e3e");
      }
    }

    async function pagarSelecionadas() {
      const selecionadas = Array.from(document.querySelectorAll(".row-checkbox:checked")).map(cb => cb.closest("tr").dataset.id);
      if (selecionadas.length === 0) return alert("Selecione ao menos uma despesa!");

      const dataPag = prompt("Digite a data do pagamento (AAAA-MM-DD):", new Date().toISOString().split("T")[0]);
      if (!dataPag) return;

      atualizarStatusSync("☁️ Atualizando pagamentos...", "#d97706");
      try {
        await fetch(`${API_URL}?action=pagarMultiplas&ids=${encodeURIComponent(JSON.stringify(selecionadas))}&dataPagamento=${dataPag}`);
        await carregarTudoGitHub();
      } catch (err) {
        console.error(err);
        atualizarStatusSync("✕ Erro ao pagar", "#e53e3e");
      }
    }

    function abrirModalControles() {
      const lista = document.getElementById("lista-controles-modal");
      lista.innerHTML = "";
      todosControles.forEach((c, idx) => {
        lista.innerHTML += `
          <li style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; background:#0f172a; padding:6px 12px; border-radius:4px;">
            <span>${c}</span>
            <button class="btn btn-danger" style="padding:2px 6px; font-size:0.75rem;" onclick="removerControle(${idx})">🗑️</button>
          </li>
        `;
      });
      document.getElementById("modal-controles").classList.add("active");
    }

    function fecharModalControles() {
      document.getElementById("modal-controles").classList.remove("active");
    }

    async function adicionarNovoControle() {
      const nome = document.getElementById("novo-controle-nome").value.trim();
      if (!nome) return;
      if (!todosControles.includes(nome)) {
        todosControles.push(nome);
        await salvarControlesNoServer();
        document.getElementById("novo-controle-nome").value = "";
        abrirModalControles();
      }
    }

    async function removerControle(idx) {
      if (todosControles.length <= 1) return alert("É necessário ter ao menos um controle.");
      todosControles.splice(idx, 1);
      await salvarControlesNoServer();
      abrirModalControles();
    }

    async function salvarControlesNoServer() {
      atualizarStatusSync("☁️ Salvando controles...", "#d97706");
      try {
        await fetch(`${API_URL}?action=salvarControles&data=${encodeURIComponent(JSON.stringify(todosControles))}`);
        atualizarSelectControles();
        aplicarFiltros();
        atualizarStatusSync("✓ Sincronizado", "#16a34a");
      } catch (err) {
        console.error(err);
        atualizarStatusSync("✕ Erro ao salvar", "#e53e3e");
      }
    }

    function gerarPDFSelecionadas() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      const checkboxes = document.querySelectorAll(".row-checkbox:checked");
      if (checkboxes.length === 0) return alert("Selecione ao menos uma despesa para gerar o PDF.");

      const dataHoje = new Date().toLocaleDateString("pt-BR");
      doc.setFontSize(16);
      doc.text("Relatório de Despesas Selecionadas", 14, 15);
      doc.setFontSize(10);
      doc.text(`Data de geração: ${dataHoje}`, 14, 22);

      const rows = [];
      let total = 0;

      checkboxes.forEach(cb => {
        const tr = cb.closest("tr");
        const id = tr.dataset.id;
        const item = todasDespesas.find(d => d.id.toString() === id.toString());
        if (item) {
          total += item.valor;
          rows.push([
            item.controle,
            item.fornecedor,
            formatarMoeda(item.valor),
            item.vencimento ? item.vencimento.split("-").reverse().join("/") : "",
            item.pagamento ? item.pagamento.split("-").reverse().join("/") : "-",
            calcularStatusAutomatico(item.vencimento, item.status)
          ]);
        }
      });

      doc.autoTable({
        startY: 28,
        head: [["Controle", "Fornecedor", "Valor", "Vencimento", "Pagamento", "Situação"]],
        body: rows,
      });

      const finalY = doc.lastAutoTable.finalY + 10;
      doc.setFontSize(12);
      doc.text(`Total Selecionado: ${formatarMoeda(total)}`, 14, finalY);

      doc.save(`despesas_selecionadas_${new Date().toISOString().split("T")[0]}.pdf`);
    }

    function exportarCSV() {
      let csv = "Controle,Fornecedor,Valor,Vencimento,Pagamento,Situacao\n";
      todasDespesas.forEach(d => {
        const st = calcularStatusAutomatico(d.vencimento, d.status);
        csv += `"${d.controle}","${d.fornecedor}",${d.valor},"${d.vencimento}","${d.pagamento || ""}","${st}"\n`;
      });
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `despesas_${new Date().toISOString().split("T")[0]}.csv`;
      a.click();
    }
  </script>
</body>
</html>
